[project]
name = "forecast-hub"
version = "0.1.0"
description = "Forecast Hub — Aggregate prediction market data from Polymarket and Kalshi, detect cross-platform overlaps, and explore collective market consensus via interactive dashboard."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27.0",
    "pandas>=2.1.0",
    "streamlit>=1.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
