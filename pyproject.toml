[project]
name = "polymarket"
version = "0.1.0"
description = "Polymarket Business Intelligence Dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "streamlit>=1.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
